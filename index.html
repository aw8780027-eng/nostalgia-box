<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Nostalgia Box</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
        }
        #tv-screen {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; border-radius: 0px; border: none;
        }
        #channel-display {
            position: absolute; top: 30px; right: 40px;
            color: #00ff00; font-family: 'Courier New', monospace;
            font-size: 40px; font-weight: bold; text-shadow: 0 0 10px #00ff00;
            opacity: 0; transition: opacity 0.5s ease-in-out; pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <iframe id="tv-screen" src="" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="channel-display">CH 01</div>

    <script>
        // ΕΔΩ ΧΩΡΙΖΕΙΣ ΤΑ ΒΙΝΤΕΟ ΣΟΥ ΣΕ 3 ΚΑΝΑΛΙΑ
        const channels = {
            1: [
                "https://youtube-nocookie.com",
                "https://youtube-nocookie.com" // Βάλε όσα θες για το Κανάλι 1
            ],
            2: [
                "https://youtube-nocookie.com",
                "https://youtube-nocookie.com" // Βάλε όσα θες για το Κανάλι 2
            ],
            3: [
                "https://youtube-nocookie.com",
                "https://youtube-nocookie.com" // Βάλε όσα θες για το Κανάλι 3
            ]
        };

        let currentChannel = 1; // Ξεκινάει από το Κανάλι 1
        const screen = document.getElementById('tv-screen');
        const display = document.getElementById('channel-display');

        function playChannel() {
            // Παίρνει τη λίστα των βίντεο του συγκεκριμένου καναλιού
            const currentVideoList = channels[currentChannel];
            
            // Επιλέγει ένα βίντεο στην τύχη ΜΕΣΑ από αυτό το κανάλι
            const randomVideoIdx = Math.floor(Math.random() * currentVideoList.length);
            
            // Φορτώνει το τυχαίο βίντεο στην οθόνη
            screen.src = currentVideoList[randomVideoIdx];
            
            // Δείχνει στην οθόνη CH 01, CH 02, CH 03
            display.innerText = "CH " + String(currentChannel).padStart(2, '0');
            display.style.opacity = "1";
            setTimeout(() => { display.style.opacity = "0"; }, 2000);
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight' || event.key === 'Enter') {
                // Πάει στο επόμενο κανάλι (1 -> 2 -> 3 -> 1)
                currentChannel = currentChannel === 3 ? 1 : currentChannel + 1;
                playChannel();
            } else if (event.key === 'ArrowLeft') {
                // Πάει στο προηγούμενο κανάλι (3 -> 2 -> 1 -> 3)
                currentChannel = currentChannel === 1 ? 3 : currentChannel - 1;
                playChannel();
            }
        });

        // Φόρτωση του πρώτου καναλιού με το που ανοίγει
        window.onload = playChannel;
    </script>
</body>
</html>

</body>
</html>
