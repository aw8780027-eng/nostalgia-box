<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Greek Nostalgia Box</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
        }
        #tv-screen {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; border-radius: 0px; border: none;
        }
        #channel-display {
            position: absolute; top: 30px; right: 40px;
            color: #00ff00; font-family: 'Courier New', monospace;
            font-size: 40px; font-weight: bold; text-shadow: 0 0 10px #00ff00;
            opacity: 0; transition: opacity 0.5s ease-in-out; pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <iframe id="tv-screen" src="" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="channel-display">CH 01</div>

    <script>
        // ΤΑ 3 ΚΑΝΑΛΙΑ ΣΟΥ - ΤΟ ΚΑΝΑΛΙ 1 ΕΧΕΙ ΟΛΕΣ ΤΙΣ ΔΙΑΦΗΜΙΣΕΙΣ VODAFONE LUMIA
        const channels = {
            1: [
                // ΚΑΝΑΛΙ 1: Vodafone Greece - Microsoft & Nokia Lumia Ads
                "https://youtube-nocookie.com", // Nokia Lumia 520 Vodafone
                "https://youtube-nocookie.com", // Nokia Lumia 625 Vodafone
                "https://youtube-nocookie.com", // Nokia Lumia 925 Ομάδα Ready
                "https://youtube-nocookie.com", // Microsoft Lumia 535 Vodafone
                "https://youtube-nocookie.com", // Nokia Lumia 1020 Camera Ad
                "https://youtube-nocookie.com"  // Vodafone Smart & Lumia Promo
            ],
            2: [
                // ΚΑΝΑΛΙ 2: Άλλες παλιές ελληνικές διαφημίσεις (80s, 90s, 00s)
                "https://youtube-nocookie.com", // Μεγάλο Compilation
                "https://youtube-nocookie.com"  // Ρετρό TV Ads GR
            ],
            3: [
                // ΚΑΝΑΛΙ 3: Παλιά Κινούμενα Σχέδια (Cartoons στα ελληνικά)
                "https://youtube-nocookie.com", // Αστυνόμος Σαΐνης / Thundercats GR
                "https://youtube-nocookie.com"  // Παλιά κλασικά Looney Tunes
            ]
        };

        let currentChannel = 1;
        const screen = document.getElementById('tv-screen');
        const display = document.getElementById('channel-display');

        function playChannel() {
            const currentVideoList = channels[currentChannel];
            const randomVideoIdx = Math.floor(Math.random() * currentVideoList.length);
            
            screen.src = currentVideoList[randomVideoIdx];
            
            display.innerText = "CH " + String(currentChannel).padStart(2, '0');
            display.style.opacity = "1";
            setTimeout(() => { display.style.opacity = "0"; }, 2000);
        }

        // Έλεγχος με το τηλεκοντρόλ του Mi Box / Πληκτρολόγιο PC
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight' || event.key === 'Enter') {
                currentChannel = currentChannel === 3 ? 1 : currentChannel + 1;
                playChannel();
            } else if (event.key === 'ArrowLeft') {
                currentChannel = currentChannel === 1 ? 3 : currentChannel - 1;
                playChannel();
            }
        });

        window.onload = playChannel;
    </script>
</body>
</html>


</body>
</html>
