<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Greek Nostalgia Box</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
        }
        #tv-screen {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; border-radius: 0px; border: none;
        }
        #channel-display {
            position: absolute; top: 30px; right: 40px;
            color: #00ff00; font-family: 'Courier New', monospace;
            font-size: 30px; font-weight: bold; text-shadow: 0 0 10px #00ff00;
            opacity: 0; transition: opacity 0.5s ease-in-out; pointer-events: none;
            z-index: 9999; text-align: right; line-height: 1.4;
        }
    </style>
</head>
<body>

    <iframe id="tv-screen" src="" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="channel-display">CH 01</div>

    <script>
        // ΑΛΛΑΓΗ ΑΠΟ /embed/ ΣΕ /v/ ΓΙΑ ΝΑ ΜΗΝ ΑΡΝΕΙΤΑΙ ΤΗ ΣΥΝΔΕΣΗ ΤΟ YOUTUBE
        const channels = {
            1: [
                { name: "Vodafone - Nokia Lumia 520", url: "https://youtube.com" },
                { name: "Vodafone - Nokia Lumia 625", url: "https://youtube.com" },
                { name: "Vodafone Ready - Nokia Lumia 925", url: "https://youtube.com" },
                { name: "Vodafone - Microsoft Lumia 535", url: "https://youtube.com" },
                { name: "Vodafone - Nokia Lumia 1020 Camera", url: "https://youtube.com" },
                { name: "Vodafone Smart & Lumia Promo", url: "https://youtube.com" }
            ],
            2: [
                { name: "80s & 90s Greek Ads Compilation", url: "https://youtube.com" },
                { name: "Retro TV Ads Greece", url: "https://youtube.com" }
            ],
            3: [
                { name: "Αστυνόμος Σαΐνης / Thundercats GR", url: "https://youtube.com" },
                { name: "Classic Looney Tunes Greek", url: "https://youtube.com" }
            ]
        };

        let currentChannel = 1;
        const screen = document.getElementById('tv-screen');
        const display = document.getElementById('channel-display');

        function playChannel() {
            const currentVideoList = channels[currentChannel];
            const randomVideo = currentVideoList[Math.floor(Math.random() * currentVideoList.length)];
            
            screen.src = randomVideo.url;
            
            display.innerHTML = "CH 0" + currentChannel + "<br><span style='font-size:18px; color:#ffffff; text-shadow:none;'>" + randomVideo.name + "</span>";
            display.style.opacity = "1";
            
            setTimeout(() => { display.style.opacity = "0"; }, 3000);
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight' || event.key === 'Enter') {
                currentChannel = currentChannel === 3 ? 1 : currentChannel + 1;
                playChannel();
            } else if (event.key === 'ArrowLeft') {
                currentChannel = currentChannel === 1 ? 3 : currentChannel - 1;
                playChannel();
            }
        });

        window.onload = playChannel;
    </script>
</body>
</html>




</body>
</html>
