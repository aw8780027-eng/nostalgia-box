<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Nostalgia Box</title>
    <style>
        /* Πλήρης οθόνη με κοφτερές, ίσιες γωνίες (border-radius: 0) */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
        }
        #tv-screen {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; border-radius: 0px; border: none;
        }
        /* Πράσινη ρετρό ένδειξη καναλιού */
        #channel-display {
            position: absolute; top: 30px; right: 40px;
            color: #00ff00; font-family: 'Courier New', monospace;
            font-size: 40px; font-weight: bold; text-shadow: 0 0 10px #00ff00;
            opacity: 0; transition: opacity 0.5s ease-in-out; pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- Ο Player με τις απαραίτητες ρυθμίσεις ασφαλείας για να μην μπλοκάρει το Mi Box -->
    <iframe id="tv-screen" src="" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="channel-display">CH 01</div>

    <script>
        // Διορθωμένα Links (youtube-nocookie) που ΔΕΝ τρώνε μπλοκάρισμα
        const videos = [
          "https://youtube-nocookie.com",
            "https://youtube-nocookie.com",
            "https://youtube-nocookie.com",
            "https://youtube-nocookie.com"
        ];

        let currentIdx = 0;
        const screen = document.getElementById('tv-screen');
        const display = document.getElementById('channel-display');

        function changeChannel() {
            currentIdx = Math.floor(Math.random() * videos.length);
            screen.src = videos[currentIdx];
            
            display.innerText = "CH " + String(currentIdx + 1).padStart(2, '0');
            display.style.opacity = "1";
            setTimeout(() => { display.style.opacity = "0"; }, 2000);
        }

        // Αλλαγή καναλιού με το τηλεκοντρόλ του Mi Box (Βέλη ή OK)
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight' || event.key === 'ArrowLeft' || event.key === 'Enter') {
                changeChannel();
            }
        });

        window.onload = changeChannel;
    </script>
</body>
</html>

</body>
</html>
