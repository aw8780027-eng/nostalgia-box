<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nostalgia Box TV Dashboard</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        border-radius: 0px;
    }

    body {
        position: relative;
        font-family: monospace;
    }

    #tv {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: 0;
        border-radius: 0px;
        background: #000;
    }

    #channelOverlay {
        position: fixed;
        top: 24px;
        right: 24px;
        color: #00ff66;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow:
            0 0 4px #00ff66,
            0 0 10px #00ff66;
        opacity: 0;
        pointer-events: none;
        z-index: 1000;
    }

    .show-channel {
        animation: channelFade 2s forwards;
    }

    @keyframes channelFade {
        0% {
            opacity: 1;
        }
        70% {
            opacity: 1;
        }
        100% {
            opacity: 0;
        }
    }
</style>
</head>
<body>

<iframe
    id="tv"
    allow="autoplay; fullscreen"
    allowfullscreen
></iframe>

<div id="channelOverlay">CH 1</div>

<script>
    // Placeholder YouTube embed URLs
    const channels = [
       "https://youtube.com",
            "https://youtube.com",
            "https://youtube.com"
    ];

    const tv = document.getElementById("tv");
    const overlay = document.getElementById("channelOverlay");

    let currentChannel = 0;

    function loadChannel(index) {
        currentChannel = index;
        tv.src = channels[index];

        overlay.textContent = `CH ${index + 1}`;

        overlay.classList.remove("show-channel");
        void overlay.offsetWidth; // restart animation
        overlay.classList.add("show-channel");
    }

    function randomChannel() {
        if (channels.length <= 1) return;

        let next;
        do {
            next = Math.floor(Math.random() * channels.length);
        } while (next === currentChannel);

        loadChannel(next);
    }

    document.addEventListener("keydown", (event) => {
        const key = event.key;

        if (
            key === "ArrowRight" ||
            key === "ArrowLeft" ||
            key === "Enter"
        ) {
            randomChannel();
        }
    });

    // Initial channel
    loadChannel(0);
</script>

</body>
</html>
