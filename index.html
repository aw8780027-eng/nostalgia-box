<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Greek Nostalgia Box</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
        }
        #tv-screen {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; border: none;
        }
        /* Η πράσινη ένδειξη έχει πλέον opacity: 1 για να φαίνεται ΑΜΕΣΩΣ με το που ανοίγει η σελίδα */
        #channel-display {
            position: absolute; top: 30px; right: 40px;
            color: #00ff00; font-family: 'Courier New', monospace;
            font-size: 30px; font-weight: bold; text-shadow: 0 0 10px #00ff00;
            opacity: 1; transition: opacity 0.5s ease-in-out; pointer-events: none;
            z-index: 9999; text-align: right; line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Καθαρό, κλασικό iframe με όλες τις απαραίτητες άδειες για να μην τρώει block -->
    <iframe id="tv-screen" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    
    <!-- Το CH 01 και ο τίτλος είναι πλέον γραμμένα απευθείας στο HTML για να μην βλέπεις ποτέ μαύρη οθόνη -->
    <div id="channel-display">CH 01<br><span style='font-size:18px; color:#ffffff; text-shadow:none;'>Φόρτωση Nostalgia Box...</span></div>

    <script>
        const channels = {
            1: [
                { name: "Vodafone - Microsoft Lumia 650", id: "wYOn9NInX0U" },
                { name: "Vodafone - Nokia Lumia 520 Promo", id: "O2tD-lW6U2U" },
                { name: "Vodafone Ready - Nokia Lumia 625", id: "C39xP7G-M0s" },
                { name: "Vodafone - Nokia Lumia 925 Offer", id: "3_Xk9l8HnQ" },
                { name: "Vodafone - Microsoft Lumia 535", id: "v7W6O-w8m_k" },
                { name: "Vodafone - Nokia Lumia 1020", id: "6m6Y7Vw_b_E" },
                { name: "Vodafone - Lumia & Smart Pack", id: "D9Zf8p4eXco" }
            ],
            2: [
                { name: "90s Greek Ads Mega Mix", id: "QrG-wi--kiU" },
                { name: "Retro TV Ads Greece", id: "N_L4aR8g2Yc" }
            ],
            3: [
                { name: "Αστυνόμος Σαΐνης / Thundercats GR", id: "J7cR_z1EfgA" },
                { name: "Classic Looney Tunes Greek", id: "wX4_8Jp8xM0" }
            ]
        };

        let currentChannel = 1;
        const screen = document.getElementById('tv-screen');
        const display = document.getElementById('channel-display');

        function playChannel() {
            const currentVideoList = channels[currentChannel];
            const randomVideo = currentVideoList[Math.floor(Math.random() * currentVideoList.length)];
            
            // Καθαρό URL χωρίς εξωτερικά API που κολλάνε
            screen.src = "https://youtube.com" + randomVideo.id + "?autoplay=1&mute=1&controls=0&rel=0";
            
            display.innerHTML = "CH 0" + currentChannel + "<br><span style='font-size:18px; color:#ffffff; text-shadow:none;'>" + randomVideo.name + "</span>";
            display.style.opacity = "1";
            
            // Το λογότυπο θα σβήσει μετά από 4 δευτερόλεπτα
            setTimeout(() => { display.style.opacity = "0"; }, 4000);
        }

        // Έλεγχος με τα βέλη του πληκτρολογίου
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight' || event.key === 'Enter') {
                currentChannel = currentChannel === 3 ? 1 : currentChannel + 1;
                playChannel();
            } else if (event.key === 'ArrowLeft') {
                currentChannel = currentChannel === 1 ? 3 : currentChannel - 1;
                playChannel();
            }
        });

        // Εκτέλεση με το που ανοίγει η σελίδα
        window.onload = playChannel;
    </script>
</body>
</html>






</body>
</html>
